name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create TWA Project
        run: |
          mkdir -p twa-app/app/src/main
          
          cat > twa-app/build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          EOF
          
          cat > twa-app/settings.gradle << 'EOF'
          include ':app'
          EOF
          
          cat > twa-app/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            compileSdk 34
            defaultConfig {
              applicationId "com.dailybasket.bhopalgarh"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release { minifyEnabled false }
            }
            namespace "com.dailybasket.bhopalgarh"
          }
          dependencies {
            implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          mkdir -p twa-app/app/src/main/res/values
          
          cat > twa-app/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Daily Basket" android:theme="@style/Theme.AppCompat">
              <activity android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                android:exported="true">
                <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL"
                  android:value="https://dailybasket-bhopalgarh.vercel.app"/>
                <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > twa-app/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Daily Basket</string></resources>
          EOF

      - name: Build Debug APK
        run: |
          cd twa-app
          gradle wrapper
          ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyBasket-APK
          path: twa-app/app/build/outputs/apk/debug/*.apk
