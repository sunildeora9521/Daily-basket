name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create TWA Project
        run: |
          mkdir -p twa-app/app/src/main/res/values
          mkdir -p twa-app/app/src/main/res/mipmap-mdpi
          mkdir -p twa-app/app/src/main/res/mipmap-hdpi
          mkdir -p twa-app/app/src/main/res/mipmap-xhdpi
          mkdir -p twa-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p twa-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p twa-app/gradle/wrapper

          # Download & resize app icon
          sudo apt-get install -y imagemagick -q
          curl -L "https://dailybasket-bhopalgarh.vercel.app/icon-512.png" -o icon.png
          convert icon.png -resize 48x48   twa-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72   twa-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96   twa-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 twa-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 twa-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Gradle wrapper properties - fixed 8.4
          cat > twa-app/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Download gradlew wrapper jar
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar \
            -o twa-app/gradle/wrapper/gradle-wrapper.jar

          # Download gradlew script
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew \
            -o twa-app/gradlew
          chmod +x twa-app/gradlew

          cat > twa-app/settings.gradle << 'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "DailyBasket"
          include ':app'
          EOF

          cat > twa-app/build.gradle << 'EOF'
          plugins {
            id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          cat > twa-app/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            compileSdk 34
            defaultConfig {
              applicationId "com.dailybasket.bhopalgarh"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              debug {}
            }
            namespace "com.dailybasket.bhopalgarh"
          }
          dependencies {
            implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > twa-app/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:label="Daily Basket"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:theme="@style/Theme.AppCompat.NoActionBar"
              android:allowBackup="true">
              <activity
                android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                android:exported="true"
                android:screenOrientation="portrait">
                <meta-data
                  android:name="android.support.customtabs.trusted.DEFAULT_URL"
                  android:value="https://dailybasket-bhopalgarh.vercel.app"/>
                <meta-data
                  android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                  android:resource="@color/colorPrimary"/>
                <meta-data
                  android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE"
                  android:resource="@mipmap/ic_launcher"/>
                <meta-data
                  android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR"
                  android:resource="@color/backgroundColor"/>
                <meta-data
                  android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION"
                  android:value="300"/>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          mkdir -p twa-app/app/src/main/res/values
          cat > twa-app/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">Daily Basket</string>
          </resources>
          EOF

          cat > twa-app/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="colorPrimary">#0A1A0A</color>
            <color name="backgroundColor">#070907</color>
          </resources>
          EOF

          cat > twa-app/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          android.suppressUnsupportedCompileSdk=34
          EOF

      - name: Build Debug APK
        run: |
          cd twa-app
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyBasket-APK
          path: twa-app/app/build/outputs/apk/debug/*.apk
